# Publica la app en GitHub Pages (es un sitio estático, no necesita build).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Requiere haber activado Pages una vez en Settings → Pages → Source:
      # "GitHub Actions". El token de Actions no puede crear el sitio solo
      # (la API de creación pide permisos de admin que GITHUB_TOKEN no tiene).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
