name: APK de Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # El APK de debug se firma solo con la clave de debug: alcanza para
      # instalarlo de costado y evita tener que guardar un keystore.
      - name: Compilar
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk rutina.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rutina-apk
          path: rutina.apk
          if-no-files-found: error
