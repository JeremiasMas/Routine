name: APK de Android

on:
  push:
    branches: [main]
    # Todo lo que viaja adentro del APK. Desde que el service worker sirve
    # caché primero, la app instalada ya no baja lo nuevo sola: si un cambio
    # de la web no recompila el APK, no llega nunca al teléfono. Esta lista
    # tiene que coincidir con el `copiarWeb` de android/app/build.gradle.kts,
    # y hay un test que lo comprueba.
    paths:
      - 'android/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'ataraxia/**'
      - 'clima/**'
      - '.github/workflows/android.yml'
  # En un PR sólo se compila, para enterarse antes de mergear si algo no
  # compila, y sólo por cambios de Android: el Kotlin no se rompe por tocar un
  # CSS, y compilar de más alargaría cada PR de la web para nada.
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Firma con android/app/debug.keystore, que está versionado. Sin una
      # clave fija, cada runner genera la suya y el teléfono no deja actualizar
      # encima: hay que desinstalar, y eso se lleva el historial.
      - name: Compilar
        working-directory: android
        run: gradle --no-daemon assembleDebug -PversionName=1.0.${{ github.run_number }} -PversionCode=${{ github.run_number }}

      # Salen tres APKs del mismo código: la app de siempre, Ataraxia y Clima.
      - name: Renombrar
        run: |
          cp android/app/build/outputs/apk/rutina/debug/app-rutina-debug.apk rutina.apk
          cp android/app/build/outputs/apk/ataraxia/debug/app-ataraxia-debug.apk ataraxia.apk
          cp android/app/build/outputs/apk/clima/debug/app-clima-debug.apk clima.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rutina-apk
          path: |
            rutina.apk
            ataraxia.apk
            clima.apk
          if-no-files-found: error

      # Un release fijo con el último APK: desde el teléfono es un link, un
      # toque y listo, sin ZIP y sin tener que iniciar sesión en GitHub.
      - name: Publicar el último APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag 2>/dev/null || true
          gh release create apk rutina.apk ataraxia.apk clima.apk \
            --title "Rutina, Ataraxia y Clima para Android (build ${{ github.run_number }})" \
            --notes "APKs de la versión 1.0.${{ github.run_number }}, compilados desde ${{ github.sha }}.

          - \`rutina.apk\`: Rutina RPG.
          - \`ataraxia.apk\`: Ataraxia.
          - \`clima.apk\`: Clima, con el widget de qué ponerse.

          Para instalar: abrí este link desde el teléfono, bajá el archivo que corresponda y tocalo. Android va a pedir permiso para instalar apps de esta fuente."
